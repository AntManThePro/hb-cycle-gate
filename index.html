<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#00ff87" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Cycle Gate" />
<title>HOOD BOSS NEXUS — Cycle Gate</title>
<link rel="manifest" href="./manifest.json" />
<link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
<link rel="apple-touch-icon" href="./icons/icon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@500;700;800&display=swap" rel="stylesheet" />
<style>
:root{--g:#00ff87;--c:#60efff;--p:#ff0080;--y:#ffcc00;--bg:#07070b;--panel:#0d0d14;--line:rgba(0,255,135,.22);--ink:#e8fff4;--mute:#7d8b86}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:"Share Tech Mono",ui-monospace,monospace}
body{overflow:hidden}
.app{display:grid;grid-template-rows:64px 1fr;height:100%;min-height:100dvh}
.top{display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,rgba(0,255,135,.06),transparent 40%,rgba(255,0,128,.05))}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:36px;height:36px;border-radius:9px;box-shadow:0 0 18px rgba(0,255,135,.45)}
.brand h1{font-family:Orbitron,sans-serif;font-size:13px;letter-spacing:.12em;color:var(--g);white-space:nowrap}
.brand small{display:block;color:var(--c);font-size:10px;letter-spacing:.16em;opacity:.85}
.top-stats{display:flex;gap:10px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.pill{border:1px solid var(--line);padding:6px 10px;border-radius:999px;font-size:11px;color:var(--c);background:rgba(0,0,0,.35)}
.pill b{color:var(--y);margin-left:6px}
.pill.hot{border-color:rgba(255,0,128,.5);color:var(--p)}
.stage{display:grid;grid-template-columns:300px 1fr;min-height:0}
.rail{border-right:1px solid var(--line);overflow:auto;padding:12px;background:rgba(13,13,20,.92)}
.rail h2{font-family:Orbitron,sans-serif;font-size:11px;letter-spacing:.18em;color:var(--c);margin:4px 0 10px}
.row-btns{display:flex;gap:8px;margin-bottom:10px}
button{font-family:inherit;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--g);padding:8px 10px;border-radius:8px;font-size:11px;letter-spacing:.06em}
button:hover{box-shadow:0 0 14px rgba(0,255,135,.25);background:rgba(0,255,135,.06)}
button.pink{color:var(--p);border-color:rgba(255,0,128,.4)}
button.cyan{color:var(--c);border-color:rgba(96,239,255,.4)}
button.solid{background:var(--g);color:#04140c;border-color:var(--g);font-weight:700}
.tech{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;cursor:pointer;background:rgba(0,255,135,.03)}
.tech.active{border-color:var(--g);box-shadow:inset 0 0 0 1px rgba(0,255,135,.35),0 0 16px rgba(0,255,135,.12)}
.tech .nm{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.tech .meta{color:var(--mute);font-size:10px;margin-top:4px}
.badge{font-size:9px;letter-spacing:.12em;padding:2px 6px;border-radius:999px;border:1px solid}
.badge.due{color:var(--y);border-color:var(--y)}
.badge.over{color:var(--p);border-color:var(--p);animation:pulse 1.6s infinite}
.badge.ok{color:var(--g);border-color:var(--g)}
@keyframes pulse{50%{opacity:.45}}
.main{min-width:0;min-height:0;overflow:auto;padding:14px 16px 40px}
.grid2{display:grid;grid-template-columns:1.15fr .85fr;gap:14px}
.card{border:1px solid var(--line);border-radius:14px;padding:14px;background:linear-gradient(180deg,rgba(0,255,135,.04),rgba(0,0,0,.2))}
.card h3{font-family:Orbitron,sans-serif;font-size:12px;letter-spacing:.14em;color:var(--g);margin-bottom:10px}
canvas{width:100%;height:auto;display:block;border-radius:10px;background:#050509}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.kpi{border:1px solid var(--line);border-radius:10px;padding:10px}
.kpi .l{font-size:10px;color:var(--mute);letter-spacing:.12em}
.kpi .v{font-size:22px;font-family:Orbitron,sans-serif;color:var(--c);margin-top:4px}
.timeline{display:flex;gap:8px;flex-wrap:wrap}
.gate{flex:1;min-width:120px;border:1px dashed var(--line);border-radius:10px;padding:10px;text-align:center}
.gate.on{border-style:solid;border-color:var(--y)}
.gate.done{border-color:var(--g);border-style:solid}
.gate.miss{border-color:var(--p);border-style:solid}
.gate .g{font-family:Orbitron,sans-serif;color:var(--c);font-size:12px}
.gate .s{font-size:10px;color:var(--mute);margin-top:4px}
form.review label{display:block;font-size:10px;color:var(--mute);margin:10px 0 4px}
input,select,textarea{width:100%;background:#08080e;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px 10px;font-family:inherit;font-size:12px}
textarea{min-height:70px;resize:vertical}
.slider-row{display:grid;grid-template-columns:1fr 48px;gap:8px;align-items:center}
input[type=range]{accent-color:var(--g)}
.flags{display:flex;flex-wrap:wrap;gap:6px}
.flag{font-size:10px;border:1px solid var(--line);border-radius:999px;padding:5px 8px;cursor:pointer;color:var(--mute)}
.flag.on{color:#04140c;background:var(--p);border-color:var(--p)}
.verdict{margin-top:12px;padding:12px;border-radius:12px;border:1px solid var(--g);background:rgba(0,255,135,.06)}
.verdict.hold{border-color:var(--y);background:rgba(255,204,0,.07)}
.verdict.fail{border-color:var(--p);background:rgba(255,0,128,.08)}
.list{font-size:12px;line-height:1.55;color:#c9e6d8}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:flex-end;justify-content:center;z-index:30;padding:12px}
.sheet{width:min(520px,100%);background:var(--panel);border:1px solid var(--g);border-radius:16px;padding:16px;max-height:86dvh;overflow:auto}
.install{position:fixed;bottom:12px;left:12px;right:12px;z-index:20;display:none}
.install.show{display:block}
.toast{position:fixed;top:74px;right:14px;background:#04140c;border:1px solid var(--g);color:var(--g);padding:10px 12px;border-radius:10px;z-index:40;font-size:12px}
@media (max-width:920px){.stage{grid-template-columns:1fr}.rail{display:none}.rail.open{display:block;position:absolute;inset:64px 0 0 0;z-index:12}.grid2,.kpis{grid-template-columns:1fr 1fr}}
@media print{.top,.rail,button,.install{display:none !important}body{overflow:auto}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button class="cyan" id="menuBtn" type="button">ROSTER</button>
    <div class="brand">
      <img src="./icons/icon.svg" alt="Cycle Gate" />
      <div>
        <h1>HOOD BOSS · CYCLE GATE</h1>
        <small>W1 · W2 · W4 · MONTHLY · NEXUS QA</small>
      </div>
    </div>
    <div class="top-stats">
      <div class="pill">FLEET <b id="statFleet">0</b></div>
      <div class="pill hot">OVERDUE <b id="statOver">0</b></div>
      <div class="pill">DUE 7D <b id="statDue">0</b></div>
      <div class="pill">SOLO READY <b id="statSolo">0</b></div>
    </div>
  </header>
  <div class="stage">
    <aside class="rail" id="rail">
      <h2>NEW TECH ROSTER</h2>
      <div class="row-btns">
        <button class="solid" id="addTech" type="button">+ TECH</button>
        <button class="cyan" id="exportAll" type="button">EXPORT</button>
        <button class="pink" id="resetDemo" type="button">DEMO</button>
      </div>
      <div id="roster"></div>
    </aside>
    <main class="main" id="main"></main>
  </div>
</div>
<div class="install" id="installBar">
  <div class="card" style="display:flex;gap:10px;align-items:center;justify-content:space-between">
    <div><h3 style="margin:0">SAVE TO HOME SCREEN</h3><div class="list">Custom Cycle Gate icon. Field-ready offline roster.</div></div>
    <button class="solid" id="installBtn" type="button">INSTALL</button>
  </div>
</div>
<script src="./app-core.js"></script>
<script src="./app-ui.js"></script>
</body>
</html>
